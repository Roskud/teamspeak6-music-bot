# Rights declaration file
# For more information about syntax and structure see here:
# https://github.com/Splamy/TS3AudioBot/wiki/Rights


# Admin rule for localhost (WebAPI used by ym_bridge.py)
[[rule]]
	ip = [ "127.0.0.1", "::1", "::ffff:127.0.0.1" ]
	"+" = "*"

[[rule]]
	isapi = true
	"+" = "*"

# Admin rule for ServerQuery client
[[rule]]
	useruid = [ "serveradmin" ]
	"+" = "*"

# Block built-in TS3AudioBot commands from all chat scopes (Channel, Server, Private).
# All user commands (!play, !stop, !radio, !queue, !loop, !bot, etc.) are handled by VibeSpeak (ym_bridge.py).
[[rule]]
	visibility = [ "Channel", "Server", "Private" ]
	"-" = "*"

